# SimpleProxy · 直接使用 CI 构建好的镜像（推荐）
#
# 用法：
#   1) 复制环境变量文件并修改 TOKEN：cp .env.example .env
#   2) docker compose up -d
#
# 也可以不建 .env，直接把下面 TOKEN 的默认值改掉。

services:
  simpleproxy:
    # CI 自动构建并推送到 GHCR 的镜像
    image: ghcr.io/virkingz/simpleproxy:latest
    container_name: simpleproxy
    restart: unless-stopped

    ports:
      # 左边是宿主机端口（浏览器访问用），可通过 .env 的 GATE_PORT 修改
      - "${GATE_PORT:-8080}:8080"

    environment:
      # ⚠ 必须修改：进入网关页面所需的访问令牌
      TOKEN: "${TOKEN:-changeme}"
      PORT: "8080"
      DATA_DIR: "/data"
      # 是否在被代理页面右下角注入悬浮「退出」按钮
      INJECT_EXIT_BUTTON: "true"
      # 退出代理时是否重置目标的登录态（过期其 Cookie + 清同源 JS 存储）。
      # 开启后，下次代理同一服务会像第一次一样要求登录。
      CLEAR_TARGET_COOKIES_ON_EXIT: "${CLEAR_TARGET_COOKIES_ON_EXIT:-true}"
      # 网关自身安全响应头（不上到被代理内容）。直连内网时保持 TRUST_PROXY=false。
      SECURITY_HEADERS: "${SECURITY_HEADERS:-true}"
      TRUST_PROXY: "${TRUST_PROXY:-false}"
      # 会话数量上限（防无 Cookie 狂刷 /auth 撑爆内存）
      MAX_PENDING_SESSIONS: "${MAX_PENDING_SESSIONS:-500}"
      MAX_SESSIONS: "${MAX_SESSIONS:-2000}"
      # Token 防爆破：连续失败达阈值后指数退避（429 + Retry-After）
      AUTH_MAX_FAILS: "${AUTH_MAX_FAILS:-5}"
      # 会话 Cookie 的 Secure 策略：auto（仅 HTTPS 加）/ true（恒加，仅纯 HTTPS 部署）
      COOKIE_SECURE: "${COOKIE_SECURE:-auto}"
      # 未通过校验的访客也可进入界面，输入地址后由浏览器直接跳转（界面无任何提示）
      NAVIGATE_ENABLED: "${NAVIGATE_ENABLED:-true}"
      # 是否允许跳任意地址（默认 false＝只允许字面内网 IP+端口，域名全拒）
      NAVIGATE_ALLOW_PUBLIC: "${NAVIGATE_ALLOW_PUBLIC:-false}"
      # 是否记录每次跳转（仅记放行的请求；时间/来源 IP/目标 URL/UA）
      NAVIGATE_LOG: "${NAVIGATE_LOG:-true}"
      # 未鉴权访客的跳转限流（每 IP，窗口内最大次数）
      NAVIGATE_RATE_MAX: "${NAVIGATE_RATE_MAX:-10}"
      NAVIGATE_RATE_WINDOW_MS: "${NAVIGATE_RATE_WINDOW_MS:-60000}"
      # 排查用：打印「实际转发路径 + 上游状态码」，并给响应加 X-Gate-* 诊断头
      PROXY_LOG: "${PROXY_LOG:-false}"
      # 目标做防盗链/Host 校验而返回 403 时保持默认；设为 "false" 可 A/B 对比
      STRIP_CLIENT_HEADERS: "${STRIP_CLIENT_HEADERS:-true}"
      # 前面套 CDN 时必须保持默认值（禁止共享缓存），否则 404 会被 CDN 缓存固化
      CACHE_CONTROL: "${CACHE_CONTROL:-private, no-store, max-age=0, must-revalidate}"

    volumes:
      # SQLite 数据持久化（保存的地址列表）。删除 ./data 会清空已保存地址
      - ./data:/data

    # 若目标服务跑在宿主机上（如 127.0.0.1:9000），打开下面注释，
    # 登录时填 host.docker.internal:9000 即可访问宿主机
    # extra_hosts:
    #   - "host.docker.internal:host-gateway"

    # 自带 HEALTHCHECK（见 Dockerfile），如需覆盖可打开：
    # healthcheck:
    #   test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/_gate/api/me').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
    #   interval: 30s
    #   timeout: 4s
    #   retries: 3
